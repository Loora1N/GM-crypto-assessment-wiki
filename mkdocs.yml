site_name: 密评标准知识库

site_url: https://loora1n.github.io/GM-crypto-assessment-wiki/

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色主题
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色主题
  features:
    - navigation.tabs
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy

extra:
  polyfills:
    - assets/vendor/iframe-worker/shim.js

extra_css:
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/blue-topaz-maple.css

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/javascripts/blue-topaz-maple.js
  - assets/javascripts/search-tables.js
  - assets/javascripts/search-notice.js

hooks:
  - hooks/search_tables.py
  - hooks/search_fuzzy.py

# Rebuild the preview when search worker sources outside docs/ change.
watch:
  - hooks/search

plugins:
  - search:
      lang:
        - zh
        - en
      # Preserve technical English words: prefix queries must match their original spelling.
      pipeline: []
      # Keep Chinese word boundaries; split identifier parts and punctuation.
      # Normalize hex prefixes/padding in both documents and queries (401 = 0x00000401).
      # Split GMT/GBT from their number without splitting algorithm names like SM4.
      # Preserve dots within OIDs and version numbers.
      separator: '[\s\u200b\u3000\-—_、。，．？！；,;:!?=\[\](){}"/\\]+|\.(?!\d)|\b0[xX]0*(?=[0-9A-Fa-f])|(?<=\b[Gg][MmBb][Tt])(?=\d)'
  - offline:
      enabled: !ENV [OFFLINE, false]

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: ASN.1
          lang: asn1
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - 使用手册:
      - 快速开始: index.md
      - 维护参考: maintenance/维护参考/维护参考.md
  - 密码算法:
      - 章节概览: algorithm/index.md
      - 数论补充: algorithm/数论补充/数论.md
      - 消息鉴别码:
          - 常见消息鉴别码攻击: algorithm/MAC/消息鉴别码攻击/attackMAC.md
      - 公钥密码算法:
          - SM2算法: algorithm/公钥密码算法/SM2/SM2.md
          - RSA算法: algorithm/公钥密码算法/RSA/RSA.md
  - 密码协议:
      - 章节概览: protocol/index.md
      - IPSEC协议: protocol/IPSEC/IPSEC协议详解.md
      - TLCP协议: protocol/TLCP/TLCP协议详解.md
  - 密码产品:
      - 章节概览: product/index.md
      - 智能密码钥匙:
          - APDU解析: product/智能密码钥匙/APDU解析/APDU解析.md
          - GMT0016-2023智能密码钥匙应用接口规范: product/智能密码钥匙/GMT0016-2023/GMT0016-2023智能密码钥匙密码应用接口规范.md
      - GMT0018-2023密码设备应用接口规范: product/GMT0018-2023/GMT0018-2023密码设备应用接口规范.md
  - 密码测评:
      - 章节概览: assessment/index.md
      - 测评基础:
          - 文章编写示例: assessment/测评基础/文章编写示例/文章编写示例.md
  - 国标与行标:
      - GMT0006-2023密码应用标识规范: standard/GMT0006-2023/GMT0006-2023密码应用标识规范.md
      - GBT17964-2021分组密码算法工作模式: standard/GBT17964/GBT17964-2021分组密码算法的工作模式.md
      - GMT0014-2023数字证书认证系统密码协议规范: standard/GMT0014-2023/GMT0014-2023.md
      - GMT0015-2023数字证书格式: standard/GMT0015/GMT0015-2023数字证书格式.md
      - FAQ第四版: standard/faq4/faq4.md
  - 个人笔记:
      - 笔记-王彦: notes/笔记-王彦.md
