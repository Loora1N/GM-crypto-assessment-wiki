site_name: 密评标准知识库

site_url: https://loora1n.github.io/GM-crypto-assessment-wiki/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.indexes
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang:
        - zh
        - en
  - offline:
      enabled: !ENV [OFFLINE, false]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 密码产品:
      - 智能密码钥匙:
          - APDU解析: product/智能密码钥匙/APDU解析/APDU解析.md
          - GMT0027-2014技术规范: test/test.md
