name: 文档检查与发布

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查搜索表格索引
        run: python -m unittest discover -s tests -p test_search_tables.py -v

      - name: 检查在线版
        run: mkdocs build --strict

      - name: 检查在线版搜索
        run: node tests/search.test.cjs site

      - name: 构建离线版
        env:
          OFFLINE: "true"
        run: mkdocs build --strict --site-dir site-offline

      - name: 检查离线版搜索
        run: node tests/search.test.cjs site-offline --offline

      - name: 保存离线包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crypto-assessment-wiki-offline
          path: site-offline/
          retention-days: 90

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置发布身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 发布在线版
        run: mkdocs gh-deploy --force
